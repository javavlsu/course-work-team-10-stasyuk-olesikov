<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../static/main.css" rel="stylesheet">
    <title>Main</title>
</head>
<body>
    <header class="site-header bg-transparent py-4" role="banner">
        <div class="container mx-auto px-6 flex items-center justify-between" role="navigation">
            <!-- Brand -->
            <div class="flex items-center gap-4">
                <div class="logo w-12 h-12 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-extrabold">
                    MyNG
                </div>
                <div class="flex flex-col">
                    <div class="font-extrabold text-lg">MyNG</div>
                    <div class="text-gray-500 text-xs">Платформа для онлайн инди-игр</div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex gap-2 flex-wrap" aria-label="Главная навигация">
                <a href="#home" data-target="home" class="px-3 py-2 rounded-lg font-semibold text-gray-800 hover:bg-gray-100 transition">Главная</a>
                <a href="#catalog" data-target="catalog" class="px-3 py-2 rounded-lg font-semibold text-gray-800 hover:bg-gray-100 transition">Каталог</a>
                <a href="#profile" data-target="profile" class="px-3 py-2 rounded-lg font-semibold text-gray-800 hover:bg-gray-100 transition">Профиль</a>
                <a href="#users" data-target="users" class="px-3 py-2 rounded-lg font-semibold text-gray-800 hover:bg-gray-100 transition">Пользователи</a>
                <a href="#auth" data-target="auth" class="px-3 py-2 rounded-lg font-semibold text-gray-800 hover:bg-gray-100 transition">Вход / Регистрация</a>
            </nav>
        </div>
    </header>
</body>
</html>
