<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="layout :: layout(~{::section})"
>
  <!-- Каталог игр -->
  <section
    id="catalog"
    class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"
    role="region"
    aria-labelledby="catalog-title"
  >
    <!-- Заголовок -->
    <div class="flex justify-between items-center mb-8">
      <h2
        id="catalog-title"
        class="text-3xl md:text-4xl font-bold text-gray-900"
      >
        Каталог игр
      </h2>
      <div class="text-sm text-gray-500" th:if="${games != null}">
        Всего игр: <span th:text="${games.size()}">0</span>
      </div>
    </div>

    <!-- Фильтры и поиск -->
    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="flex-1">
        <input
          type="text"
          id="searchInput"
          placeholder="Поиск по названию..."
          class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
        />
      </div>
      <div class="sm:w-48">
        <select
          id="genreFilter"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all bg-white"
        >
          <option value="">Все жанры</option>
          <option
            th:each="genre : ${T(ru.vlsu.myng.entities.Game.Genre).values()}"
            th:text="${genre}"
            th:value="${genre}"
          ></option>
        </select>
      </div>
      <button
        id="applyFiltersBtn"
        class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors duration-200 shadow-sm hover:shadow"
      >
        Фильтр
      </button>
    </div>

    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 items-stretch"
    >
      <article
        th:each="game : ${games}"
        class="game-card group flex flex-col h-full bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 overflow-hidden"
      >
        <div
          class="shrink-0 w-full h-40 bg-gradient-to-br relative transition-transform duration-500 group-hover:scale-105"
          th:classappend="${game.themeColor}"
        >
          <div
            class="absolute top-4 right-4 bg-white/90 backdrop-blur px-2 py-1 rounded-lg shadow-sm flex items-center gap-1"
          >
            <span class="text-yellow-500 text-xs"
              ><i class="fas fa-star"></i
            ></span>
            <span
              class="text-sm font-bold text-gray-800"
              th:text="${#numbers.formatDecimal(game.averageRating, 1, 1)}"
              >4.5</span
            >
          </div>
        </div>

        <div class="p-6 flex flex-col flex-1">
          <div class="flex-1">
            <div class="flex justify-between items-start mb-2">
              <h3
                class="text-xl font-bold text-gray-900 group-hover:text-blue-600 transition-colors"
                th:text="${game.name}"
              >
                Название игры
              </h3>
            </div>

            <div class="flex items-center gap-2 text-xs text-gray-400 mb-3">
              <span class="flex items-center gap-1">
                <i class="far fa-user"></i>
                <span th:text="${game.developerUsername}">admin</span>
              </span>
              <span>•</span>
              <span
                th:text="${game.firstReleaseDate != null ? #strings.substring(game.firstReleaseDate.toString(), 0, 10) : 'Скоро'}"
              >
                01.01.2024
              </span>
            </div>

            <div class="flex items-center gap-2 text-xs text-gray-400 mb-6">
              <p
                class="text-gray-600 text-sm line-clamp-2 mb-4 h-10"
                th:text="${game.description}"
              >
                Описание игры...
              </p>
            </div>

            <div class="flex flex-wrap gap-1 mb-6">
              <span
                class="text-[10px] uppercase tracking-wider font-semibold bg-gray-900 px-2 py-0.5 rounded"
                th:text="${game.genre}"
                >Action</span
              >
              <span
                th:each="tag : ${game.tags}"
                class="text-[10px] uppercase tracking-wider font-semibold bg-blue-50 text-blue-600 px-2 py-0.5 rounded"
                th:text="${tag}"
                >Tag</span
              >
            </div>
          </div>

          <div class="pt-4 mt-auto border-t border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <div class="flex gap-4 text-gray-500 text-sm">
                <span title="Просмотры">
                  <i class="far fa-eye mr-1"></i>
                  <span th:text="${game.totalViews}">0</span>
                </span>
                <span title="Запуски">
                  <i class="fas fa-play mr-1 text-xs"></i>
                  <span th:text="${game.totalLaunches}">0</span>
                </span>
                <span title="Отзывы">
                  <i class="far fa-comment mr-1"></i>
                  <span th:text="${game.reviewsCount}">0</span>
                </span>
              </div>
            </div>

            <a
              th:href="@{/games/{id}(id=${game.id})}"
              class="flex items-center justify-center w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-blue-100 hover:shadow-blue-200 active:scale-[0.98]"
            >
              Играть
            </a>
          </div>
        </div>
      </article>
    </div>

    <!-- Сообщение, если игр нет -->
    <div
      th:if="${games == null or games.isEmpty()}"
      class="text-center py-12 bg-white rounded-xl shadow-lg"
    >
      <i class="fas fa-gamepad text-6xl text-gray-300 mb-4"></i>
      <p class="text-gray-500 text-lg">В каталоге пока нет игр</p>
      <p class="text-gray-400 text-sm">
        Станьте разработчиком и опубликуйте свою первую игру!
      </p>
    </div>

    <!-- Пагинация (пока статическая, добавим позже) -->
    <div
      class="flex justify-center mt-12"
      th:if="${games != null and games.size() > 0}"
    >
      <nav class="flex items-center gap-2">
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-500 hover:bg-gray-50 transition-colors"
          >Назад</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
          >1</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
          >2</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
          >3</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-500 hover:bg-gray-50 transition-colors"
          >Вперед</a
        >
      </nav>
    </div>
  </section>
</html>
