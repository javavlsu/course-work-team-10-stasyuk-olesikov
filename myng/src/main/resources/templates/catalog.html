<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="layout :: layout(~{::section})"
>
  <!-- Каталог игр -->
  <section
    id="catalog"
    class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12"
    role="region"
    aria-labelledby="catalog-title"
  >
    <!-- Заголовок -->
    <div class="flex justify-between items-center mb-8">
      <h2
        id="catalog-title"
        class="text-3xl md:text-4xl font-bold text-gray-900"
      >
        Каталог игр
      </h2>
      <div class="text-sm text-gray-500" th:if="${games != null}">
        Всего игр: <span th:text="${games.size()}">0</span>
      </div>
    </div>

    <!-- Фильтры и поиск -->
    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <div class="flex-1">
        <input
          type="text"
          id="searchInput"
          placeholder="Поиск по названию..."
          class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
        />
      </div>
      <div class="sm:w-48">
        <select
          id="genreFilter"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all bg-white"
        >
          <option value="">Все жанры</option>
          <option
            th:each="genre : ${T(ru.vlsu.myng.entities.Game.Genre).values()}"
            th:text="${genre}"
            th:value="${genre}"
          ></option>
        </select>
      </div>
      <button
        id="applyFiltersBtn"
        class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors duration-200 shadow-sm hover:shadow"
      >
        Фильтр
      </button>
    </div>

    <!-- Сетка игр -->
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 items-stretch"
    >
      <article
        th:each="game : ${games}"
        class="game-card flex flex-col h-full bg-white rounded-xl shadow-md hover:shadow-xl transition-all"
      >
        <div
          class="shrink-0 w-full h-48 bg-gradient-to-br"
          th:classappend="${game.themeColor}"
        ></div>

        <div class="p-5 flex flex-col flex-1">
          <div class="flex-1">
            <div class="flex justify-between items-start mb-2">
              <h3
                class="text-xl font-bold text-gray-900"
                th:text="${game.name}"
              >
                Name
              </h3>
            </div>

            <p
              class="text-gray-600 text-sm line-clamp-2 mb-4"
              th:text="${game.description}"
            >
              Descr
            </p>

            <div class="flex flex-wrap mb-4">
              <span
                class="text-xs bg-gray-100 px-2 py-1 rounded mr-2 mb-2"
                th:text="${game.genre}"
                >Genre</span
              >
              <span
                th:each="tag : ${game.tags}"
                class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded mr-2 mb-2"
                th:text="${tag}"
                >Tag</span
              >
            </div>
          </div>

          <div class="pt-4 mt-auto border-t border-gray-100">
            <a
              th:href="@{/game/{id}(id=${game.id})}"
              class="flex items-center justify-center w-full px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors"
            >
              Играть
            </a>
          </div>
        </div>
      </article>
    </div>

    <!-- Сообщение, если игр нет -->
    <div
      th:if="${games == null or games.isEmpty()}"
      class="text-center py-12 bg-white rounded-xl shadow-lg"
    >
      <i class="fas fa-gamepad text-6xl text-gray-300 mb-4"></i>
      <p class="text-gray-500 text-lg">В каталоге пока нет игр</p>
      <p class="text-gray-400 text-sm">
        Станьте разработчиком и опубликуйте свою первую игру!
      </p>
    </div>

    <!-- Пагинация (пока статическая, добавим позже) -->
    <div
      class="flex justify-center mt-12"
      th:if="${games != null and games.size() > 0}"
    >
      <nav class="flex items-center gap-2">
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-500 hover:bg-gray-50 transition-colors"
          >Назад</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
          >1</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
          >2</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
          >3</a
        >
        <a
          href="#"
          class="px-4 py-2 bg-white border border-gray-200 rounded-lg text-gray-500 hover:bg-gray-50 transition-colors"
          >Вперед</a
        >
      </nav>
    </div>
  </section>

  <!-- Добавляем JavaScript для фильтрации и цветов жанров -->
  <script th:inline="javascript">
    function getGenreColor(genre) {
      const colors = {
        action: "from-red-500 to-orange-600",
        adventure: "from-yellow-500 to-orange-600",
        rpg: "from-purple-500 to-pink-600",
        simulation: "from-green-500 to-emerald-600",
        strategy: "from-blue-500 to-cyan-600",
        sports: "from-green-500 to-blue-600",
        puzzle: "from-indigo-500 to-purple-600",
        horror: "from-gray-700 to-gray-900",
        platformer: "from-cyan-500 to-blue-600",
        sandbox: "from-yellow-500 to-red-600",
        visual_novel: "from-pink-500 to-purple-600",
        roguelike: "from-orange-500 to-red-600",
      };
      return colors[genre] || "from-indigo-500 to-purple-600";
    }

    // Простая клиентская фильтрация (пока для демонстрации)
    document.addEventListener("DOMContentLoaded", function () {
      const searchInput = document.getElementById("searchInput");
      const genreFilter = document.getElementById("genreFilter");
      const applyBtn = document.getElementById("applyFiltersBtn");
      const gameCards = document.querySelectorAll(".game-card");

      function filterGames() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedGenre = genreFilter.value;

        gameCards.forEach((card) => {
          const gameName = card.querySelector("h3").textContent.toLowerCase();
          const gameGenre = card.querySelector(
            ".flex.flex-wrap.gap-2 span:first-child",
          ).textContent;

          const matchesSearch = gameName.includes(searchTerm);
          const matchesGenre = !selectedGenre || gameGenre === selectedGenre;

          card.style.display = matchesSearch && matchesGenre ? "flex" : "none";
        });
      }

      if (applyBtn) {
        applyBtn.addEventListener("click", filterGames);
      }
      if (searchInput) {
        searchInput.addEventListener("keyup", function (e) {
          if (e.key === "Enter") filterGames();
        });
      }
    });

    window.getGenreColor = getGenreColor;
  </script>
</html>
