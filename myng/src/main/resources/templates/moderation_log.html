<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout :: layout(~{::section})">

  <section class="bg-gray-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <!-- Шапка с навигацией -->
      <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
        <div
          class="flex flex-col md:flex-row md:items-center justify-between gap-4"
        >
          <div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Лог модерации</h1>
            <p class="text-gray-600 flex items-center gap-2">
              <i class="fas fa-history text-blue-500"></i>
              История решений модераторов по всем типам сущностей
            </p>
          </div>
        </div>
      </div>

      <!-- Основной контент - лог модерации -->
      <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Фильтры и поиск -->
        <div class="p-6 border-b border-gray-200">
          <div class="flex flex-col lg:flex-row gap-4">
            <!-- Поиск -->
            <div class="flex-1">
              <div class="relative">
                <i
                  class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"
                ></i>
                <input
                  type="text"
                  placeholder="Поиск по ID, сущности, модератору..."
                  class="w-full pl-11 pr-4 py-3 border border-gray-200 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all"
                />
              </div>
            </div>

            <!-- Фильтр по типу -->
            <div class="lg:w-48">
              <select
                class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all bg-white"
              >
                <option value="all">Все типы</option>
                <option value="game_version">Версии игр</option>
                <option value="dev_application">Заявки</option>
                <option value="review">Отзывы</option>
              </select>
            </div>

            <!-- Фильтр по результату -->
            <div class="lg:w-48">
              <select
                class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all bg-white"
              >
                <option value="all">Все результаты</option>
                <option value="approved">Одобрено</option>
                <option value="rejected">Отклонено</option>
                <option value="deleted">Удалено</option>
              </select>
            </div>

            <!-- Фильтр по дате -->
            <div class="lg:w-48">
              <select
                class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all bg-white"
              >
                <option value="all">За всё время</option>
                <option value="today">Сегодня</option>
                <option value="week">Неделя</option>
                <option value="month">Месяц</option>
              </select>
            </div>
          </div>

          <!-- Активные фильтры -->
          <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t border-gray-100">
            <span class="text-sm text-gray-500 mr-2 py-1.5"
              >Активные фильтры:</span
            >
            <span
              class="inline-flex items-center gap-1 px-3 py-1.5 bg-blue-50 text-blue-700 text-sm rounded-lg"
            >
              Тип: Версии игр
              <button class="hover:text-blue-900">
                <i class="fas fa-times"></i>
              </button>
            </span>
            <button
              class="px-3 py-1.5 text-gray-500 hover:text-gray-700 text-sm"
            >
              <i class="fas fa-undo mr-1"></i>
              Сбросить все
            </button>
          </div>
        </div>

        <!-- Таблица лога -->
        <div class="log-table-container overflow-x-auto">
          <table class="w-full min-w-[1000px]">
            <thead>
              <tr class="bg-gray-50 border-b border-gray-200">
                <th
                  class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  ID
                </th>
                <th
                  class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  Сущность
                </th>
                <th
                  class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  Тип
                </th>
                <th
                  class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  Модератор
                </th>
                <th
                  class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  Статус
                </th>
                <th
                  class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  Причина
                </th>
                <th
                  class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                >
                  Дата и время
                </th>
              </tr>
            </thead>
              <tbody class="divide-y divide-gray-200">
              <tr th:each="item : ${moderationItems}"
                  class="hover:bg-blue-50/30 transition-colors">

                  <!-- ID -->
                  <td class="px-6 py-4">
                    <span class="inline-flex items-center px-2.5 py-1.5 rounded-lg bg-gray-100 text-gray-800 font-mono text-sm"
                          th:text="'#' + ${item.id}">
                        #101
                    </span>
                  </td>

                  <!-- ENTITY -->
                  <td class="px-6 py-4">
                      <div class="flex items-center gap-2">

                          <!-- Иконка по типу -->
                          <div th:switch="${item.type}"
                               class="w-8 h-8 rounded-full flex items-center justify-center"
                               th:classappend="
                                    ${item.type == 'GAME_VERSION'} ? 'bg-blue-100' :
                                    (${item.type == 'DEV_APPLICATION'} ? 'bg-purple-100' :
                                    'bg-yellow-100')">

                              <i th:case="'GAME_VERSION'"
                                 class="fas fa-gamepad text-blue-600 text-sm"></i>

                              <i th:case="'DEV_APPLICATION'"
                                 class="fas fa-user-plus text-purple-600 text-sm"></i>

                              <i th:case="'REVIEW'"
                                 class="fas fa-star text-yellow-600 text-sm"></i>

                          </div>

                          <!-- Текст сущности -->
                          <div>
                              <div class="font-medium text-gray-900">

                                  <!-- GAME_VERSION -->
                                    <span th:if="${item.type == 'GAME_VERSION'}"
                                        th:text="'#' + ${item.id} + ' (Версия игры)'">
                                    </span>

                                  <!-- DEV_APPLICATION -->
                                    <span th:if="${item.type == 'DEV_APPLICATION'}"
                                        th:text="'#' + ${item.id} + ' (Заявка разработчика)'">
                                    </span>

                                  <!-- REVIEW -->
                                  <span th:if="${item.type == 'REVIEW'}"
                                        th:text="'#' + ${item.id} + ' (Отзыв)'">
                                    </span>

                              </div>

                              <!-- Доп. информация -->
                              <div class="text-xs text-gray-500">

                                <span th:if="${item.type == 'GAME_VERSION'}"
                                      th:text="${item.commitHash}">
                                </span>

                              <span th:if="${item.type == 'DEV_APPLICATION'}"
                                    th:text="'Пользователь: ' + ${item.username}">
                              </span>

                                <span th:if="${item.type == 'REVIEW'}"
                                                    th:text="'Игра ID: ' + ${item.gameId}">
                                </span>

                              </div>
                          </div>
                      </div>
                  </td>

                  <!-- TYPE -->
                  <td class="px-6 py-4">
                    <span class="px-3 py-1.5 text-xs font-medium rounded-full"
                          th:classappend="
                            ${item.type == 'GAME_VERSION'} ? 'bg-blue-50 text-blue-700' :
                            (${item.type == 'DEV_APPLICATION'} ? 'bg-purple-50 text-purple-700' :
                            'bg-yellow-50 text-yellow-700')"
                          th:text="${item.type.toLowerCase()}">
                    </span>
                  </td>

                  <td class="px-6 py-4">
                    <span class="font-medium text-gray-900"
                          th:text="${item.moderatorUsername != null} ? '@' + ${item.moderatorUsername} : '—'">
                        —
                    </span>
                  </td>

                  <!-- RESULT (пример логики) -->
                  <td class="px-6 py-4">
                      <!-- На модерации -->
                      <span th:if="${item.approved == null}"
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium rounded-lg bg-gray-100 text-gray-700">
                            На модерации
                        </span>

                      <!-- Одобрено -->
                      <span th:if="${item.approved == true}"
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium rounded-lg bg-green-100 text-green-700">
                            Одобрено
                        </span>

                      <!-- REVIEW и удалено -->
                      <span th:if="${item.approved == false and item.type == 'REVIEW'}"
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium rounded-lg bg-red-100 text-red-700">
                            Удалено
                        </span>

                      <!-- Остальные отклонения -->
                      <span th:if="${item.approved == false and item.type != 'REVIEW'}"
                            class="inline-flex items-center gap-1 px-3 py-1.5 text-sm font-medium rounded-lg bg-red-100 text-red-700">
                            Отклонено
                        </span>
                  </td>

                  <!-- REASON / CONTENT -->
                  <td class="px-6 py-4 max-w-xs">
                      <p class="text-sm text-gray-600"
                         th:text="${item.reason == null} ? '—' : ${item.reason}">
                      </p>
                  </td>

                  <!-- DATE -->
                  <td class="px-6 py-4">
                      <div class="text-sm text-gray-900"
                           th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd')}">
                      </div>
                      <div class="text-xs text-gray-500"
                           th:text="${#temporals.format(item.createdAt, 'HH:mm')}">
                      </div>
                  </td>

              </tr>
              </tbody>
          </table>
        </div>

        <!-- Пагинация и итоги -->
        <div
          class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex flex-col sm:flex-row justify-between items-center gap-4"
        >
          <div class="text-sm text-gray-500">
            Показано <span class="font-medium">1-4</span> из
            <span class="font-medium">156</span> записей
          </div>
          <div class="flex items-center gap-2">
            <button
              class="px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors"
              disabled
            >
              <i class="fas fa-chevron-left"></i>
            </button>
            <button
              class="px-3 py-1.5 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors"
            >
              1
            </button>
            <button
              class="px-3 py-1.5 bg-white border border-gray-300 text-sm font-medium text-gray-600 rounded-lg hover:bg-gray-50 transition-colors"
            >
              2
            </button>
            <button
              class="px-3 py-1.5 bg-white border border-gray-300 text-sm font-medium text-gray-600 rounded-lg hover:bg-gray-50 transition-colors"
            >
              3
            </button>
            <span class="text-gray-400">...</span>
            <button
              class="px-3 py-1.5 bg-white border border-gray-300 text-sm font-medium text-gray-600 rounded-lg hover:bg-gray-50 transition-colors"
            >
              12
            </button>
            <button
              class="px-3 py-1.5 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50 transition-colors"
            >
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <style>
        body {
          font-family: "Inter", sans-serif;
          /* background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); */
          min-height: 100vh;
        }

        /* Кастомный скроллбар */
        .log-table-container::-webkit-scrollbar {
          height: 8px;
          width: 8px;
        }

        .log-table-container::-webkit-scrollbar-track {
          background: #f1f1f1;
          border-radius: 4px;
        }

        .log-table-container::-webkit-scrollbar-thumb {
          background: #cbd5e0;
          border-radius: 4px;
        }

        .log-table-container::-webkit-scrollbar-thumb:hover {
          background: #94a3b8;
        }

        /* Анимация для новых записей */
        @keyframes highlight-new {
          0% {
            background-color: rgba(59, 130, 246, 0.1);
          }
          100% {
            background-color: transparent;
          }
        }

        .new-log-entry {
          animation: highlight-new 2s ease-out;
        }
    </style>
  </section>
</html>
