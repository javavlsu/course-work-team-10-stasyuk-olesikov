<div th:fragment="myGamesFragment"
     id="games-section"
     class="section-block">

    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <i class="fas fa-gamepad text-green-600"></i>
        Мои игры
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- Dynamic game cards -->
        <article th:each="game : ${games}"
                 class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden">

            <!-- Optional: keep static gradient or randomize later -->
            <div class="h-40 bg-gradient-to-br from-emerald-500 to-teal-600"></div>

            <div class="p-5">
                <div class="flex justify-between items-start mb-2">

                    <!-- Game name -->
                    <h4 class="text-lg font-bold text-gray-900"
                        th:text="${game.name}">
                        Game Name
                    </h4>

                    <!-- Status -->
                    <span class="px-2 py-1 text-xs font-medium rounded-full"
                          th:text="${game.approved ? 'Опубликована' : 'На модерации'}"
                          th:classappend="${game.approved ? ' bg-green-100 text-green-700' : ' bg-yellow-100 text-yellow-700'}">
                        Статус
                    </span>

                </div>

                <!-- Description -->
                <p class="text-gray-600 text-sm mb-4"
                   th:text="${game.descr}">
                    Description
                </p>

                <div class="flex items-center justify-between">

                    <!-- Stats -->
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <span>
                            <i class="fas fa-eye"></i>
                            <span th:text="${game.viewCount}">0</span>
                        </span>
                        <span>
                            <i class="fas fa-star"></i>
                            <span th:text="${game.rating}">0.0</span>
                        </span>
                    </div>

                    <!-- Manage button -->
                    <button class="text-blue-600 hover:text-blue-700 text-sm font-medium">
                        Управлять
                        <i class="fas fa-chevron-right ml-1 text-xs"></i>
                    </button>

                </div>
            </div>
        </article>

    </div>
</div>
