<div th:fragment="myGamesFragment"
     id="games-section"
     class="section-block">
    <h3
            class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2"
    >
        <i class="fas fa-gamepad text-green-600"></i>
        Мои игры
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Игра 1 -->
        <article
                class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden"
        >
            <div
                    class="h-40 bg-gradient-to-br from-emerald-500 to-teal-600"
            ></div>
            <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                    <h4 class="text-lg font-bold text-gray-900">Pixel Knights</h4>
                    <span
                            class="px-2 py-1 bg-green-100 text-green-700 text-xs font-medium rounded-full"
                    >Опубликована</span
                    >
                </div>
                <p class="text-gray-600 text-sm mb-4">
                    Ретро платформер с элементами RPG
                </p>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <span><i class="fas fa-download"></i> 1.2K</span>
                        <span><i class="fas fa-star"></i> 4.5</span>
                    </div>
                    <button
                            class="text-blue-600 hover:text-blue-700 text-sm font-medium"
                    >
                        Управлять
                        <i class="fas fa-chevron-right ml-1 text-xs"></i>
                    </button>
                </div>
            </div>
        </article>

        <!-- Игра 2 -->
        <article
                class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden"
        >
            <div
                    class="h-40 bg-gradient-to-br from-orange-500 to-red-600"
            ></div>
            <div class="p-5">
                <div class="flex justify-between items-start mb-2">
                    <h4 class="text-lg font-bold text-gray-900">Space Arena</h4>
                    <span
                            class="px-2 py-1 bg-yellow-100 text-yellow-700 text-xs font-medium rounded-full"
                    >На модерации</span
                    >
                </div>
                <p class="text-gray-600 text-sm mb-4">
                    Космический шутер с мультиплеером
                </p>
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <span><i class="fas fa-download"></i> 0</span>
                        <span><i class="fas fa-star"></i> 0</span>
                    </div>
                    <button
                            class="text-blue-600 hover:text-blue-700 text-sm font-medium"
                    >
                        Управлять
                        <i class="fas fa-chevron-right ml-1 text-xs"></i>
                    </button>
                </div>
            </div>
        </article>
    </div>
</div>
