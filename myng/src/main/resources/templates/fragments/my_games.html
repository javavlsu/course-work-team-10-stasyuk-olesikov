<div th:fragment="myGamesFragment"
     id="games-section"
     class="section-block">

    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <i class="fas fa-gamepad text-green-600"></i>
        Мои игры
    </h3>

    <div th:if="${#lists.isEmpty(mygames)}"
         class="text-gray-500 text-center py-6">
        Вы пока не загрузили ни одной игры
    </div>

    <!-- Чтобы игра отображалась верно, нужно чтобы в БД были:
    сущность игры, сущность версии этой игры и решение модерации
    по версии игры. Иначе ядерный взрыв. -->

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- Dynamic game cards -->
        <article th:each="mygame : ${mygames}"
                 class="bg-white rounded-xl shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden">

            <a th:href="@{/games/{id}(id=${mygame.id})}" class="block">
                <div th:if="${mygame.image != null}"
                     class="h-40 overflow-hidden">

                    <img th:src="${mygame.image}"
                         alt="Game image"
                         class="w-full h-full object-cover"/>
                </div>

                <div th:if="${mygame.image == null}"
                     th:class="'h-40 bg-gradient-to-br ' + ${mygame.bgClass}">
                </div>
            </a>

            <div class="p-5">
                <div class="flex justify-between items-start mb-2">

                    <!-- Game name -->
                    <h4 class="text-lg font-bold text-gray-900"
                        th:text="${mygame.name}">
                        Game Name
                    </h4>

                    <!-- Status -->
                    <span class="px-2 py-1 text-xs font-medium rounded-full"
                          th:text="${mygame.status}"
                          th:classappend="${mygame.approved == true ? 'bg-green-100 text-green-700' : (mygame.approved == false ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700')}"
                        Статус
                    </span>

                </div>

                <!-- Description -->
                <p class="text-gray-600 text-sm mb-4"
                   th:text="${mygame.descr}">
                    Description
                </p>

                <div class="flex items-center justify-between">

                    <!-- Stats -->
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <span>
                            <i class="fas fa-eye"></i>
                            <span th:text="${mygame.viewCount}">0</span>
                        </span>
                        <span>
                            <i class="fas fa-star"></i>
                            <span th:text="${mygame.rating}">0.0</span>
                        </span>
                    </div>

                    <!-- Manage button -->
                    <button class="text-blue-600 hover:text-blue-700 text-sm font-medium">
                        <a th:href="@{/games/{id}(id=${mygame.id})}">Управлять</a>
                        <i class="fas fa-chevron-right ml-1 text-xs"></i>
                    </button>

                </div>
            </div>
        </article>

    </div>
</div>
