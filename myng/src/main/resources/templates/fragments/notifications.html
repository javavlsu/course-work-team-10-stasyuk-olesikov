<div th:fragment="notificationsFragment"
    id="notifications-section"
    class="section-block">
    <h3
            class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2"
    >
        <i class="fas fa-bell text-blue-600"></i>
        Уведомления
    </h3>

    <div class="space-y-3">
        <!-- Уведомление 1 -->
        <div
                class="bg-white rounded-xl shadow-sm p-4 hover:shadow-md transition-shadow flex items-start gap-4"
        >
            <div
                    class="flex-shrink-0 w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600"
            >
                <i class="fas fa-rocket"></i>
            </div>
            <div class="flex-1">
                <div class="flex items-start justify-between">
                    <div>
                        <h4 class="font-semibold text-gray-900">
                            Новая версия игры опубликована
                        </h4>
                        <p class="text-sm text-gray-600 mt-1">
                            Cyber Knight 1.2.0 — улучшена графика, добавлен новый
                            уровень
                        </p>
                    </div>
                    <span class="text-xs text-gray-500">12 янв 2025</span>
                </div>
            </div>
            <button class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Уведомление 2 -->
        <div
                class="bg-white rounded-xl shadow-sm p-4 hover:shadow-md transition-shadow flex items-start gap-4"
        >
            <div
                    class="flex-shrink-0 w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-600"
            >
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="flex-1">
                <div class="flex items-start justify-between">
                    <div>
                        <h4 class="font-semibold text-gray-900">
                            Ваш отзыв был удалён
                        </h4>
                        <p class="text-sm text-gray-600 mt-1">
                            Причина: нарушение правил сообщества (спам)
                        </p>
                    </div>
                    <span class="text-xs text-gray-500">11 янв 2025</span>
                </div>
            </div>
            <button class="text-gray-400 hover:text-gray-600">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
</div>
