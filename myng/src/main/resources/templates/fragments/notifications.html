<div th:fragment="notificationsFragment"
     id="notifications-section"
     class="section-block">

    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <i class="fas fa-bell text-blue-600"></i>
        Уведомления
    </h3>

    <div class="space-y-3">

        <!-- Notifications from DB -->
        <div th:each="notification : ${notifications}"
             class="bg-white rounded-xl shadow-sm p-4 hover:shadow-md transition-shadow flex items-start gap-4">

            <!-- Icon -->
            <div class="flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center"
                 th:classappend="${notification.type.name() == 'system'} ? ' bg-blue-100 text-blue-600' :
                                 (${notification.type.name() == 'warning'} ? ' bg-amber-100 text-amber-600' :
                                 (${notification.type.name() == 'moderation'} ? ' bg-red-100 text-red-600' :
                                 ' bg-green-100 text-green-600'))">

                <i th:classappend="${notification.type.name() == 'system'} ? ' fas fa-cog' :
                                   (${notification.type.name() == 'warning'} ? ' fas fa-exclamation-triangle' :
                                   (${notification.type.name() == 'moderation'} ? ' fas fa-gavel' :
                                   ' fas fa-newspaper'))">
                </i>

            </div>

            <!-- Content -->
            <div class="flex-1">
                <div class="flex items-start justify-between">

                    <div>

                        <!-- Title based on type -->
                        <h4 class="font-semibold text-gray-900"
                            th:text="${notification.type.name() == 'system'} ? 'Системное уведомление' :
                                     (${notification.type.name() == 'warning'} ? 'Предупреждение' :
                                     (${notification.type.name() == 'moderation'} ? 'Модерация' :
                                     'Новости'))">
                        </h4>

                        <!-- Notification text -->
                        <p class="text-sm text-gray-600 mt-1"
                           th:text="${notification.text}">
                            Notification text
                        </p>

                    </div>

                    <!-- Date -->
                    <span class="text-xs text-gray-500"
                          th:text="${#temporals.format(notification.createdAt,'dd MMM yyyy')}">
                    </span>

                </div>
            </div>

            <!-- Delete / dismiss -->
            <button type="submit"
                    class="text-gray-400 hover:text-gray-600"
                    data-action="delete-notification"
                    th:data-notification-id="${notification.id}">
                <i class="fas fa-times"></i>
            </button>

        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(notifications)}"
             class="text-center text-gray-500 py-8">
            У вас пока нет уведомлений
        </div>

    </div>

</div>
