<div th:fragment="reviewsFragment"
     id="reviews-section"
     class="section-block">

    <h3 class="text-xl font-bold text-gray-900 mb-6 flex items-center gap-2">
        <i class="fas fa-star text-yellow-500"></i>
        Мои отзывы
    </h3>

    <div th:if="${#lists.isEmpty(reviews)}"
         class="text-gray-500 text-center py-6">
        У вас пока нет отзывов
    </div>

    <div class="space-y-4">

        <article th:each="review : ${reviews}"
                 th:attr="data-review-id=${review.id}"
                 class="review-edit-card bg-white rounded-xl shadow-sm p-6 hover:shadow-md transition-shadow">

            <div class="flex items-start justify-between mb-4">

                <div class="flex items-center gap-3">

                    <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold"
                         th:text="${#strings.substring(review.user.username,0,2).toUpperCase()}">
                    </div>

                    <div>
                        <div class="font-semibold text-gray-900"
                             th:text="${review.user.username}">
                        </div>

                        <div class="text-sm text-gray-500"
                             th:text="${#temporals.format(review.createdAt,'dd MMM yyyy')}">
                        </div>
                    </div>

                </div>

                <!-- VIEW MODE RATING -->
                <div class="review-rating text-xl view-mode">
                    <span th:each="i : ${#numbers.sequence(1,5)}"
                          th:text="${i <= review.rating ? '★' : '☆'}"></span>
                </div>

                <!-- EDIT MODE RATING -->
                <div class="edit-mode hidden text-xl">
                    <span class="star cursor-pointer text-gray-400" data-value="1" data-action="edit-review">★</span>
                    <span class="star cursor-pointer text-gray-400" data-value="2" data-action="edit-review">★</span>
                    <span class="star cursor-pointer text-gray-400" data-value="3" data-action="edit-review">★</span>
                    <span class="star cursor-pointer text-gray-400" data-value="4" data-action="edit-review">★</span>
                    <span class="star cursor-pointer text-gray-400" data-value="5" data-action="edit-review">★</span>

                    <input type="hidden"
                           name="rating"
                           th:value="${review.rating}"
                           class="rating-input">
                </div>

            </div>

            <!-- VIEW MODE TEXT -->
            <p class="text-gray-700 view-mode"
               th:text="${review.text}">
            </p>

            <!-- EDIT MODE TEXT -->
            <textarea class="edit-mode hidden w-full border rounded-lg p-2"
                      th:text="${review.text}">
            </textarea>

            <div class="flex items-center gap-4 mt-4 pt-4 border-t border-gray-100">

                <span class="text-sm text-gray-500">
                <i class="fas fa-gamepad mr-1"></i>
                <span th:text="${review.game.name}"></span>
                </span>

                <!-- VIEW BUTTONS -->
                <button class="review-edit-btn view-mode text-sm text-blue-600 hover:text-blue-700 font-medium"
                        data-action="edit-review">
                    <i class="fas fa-pencil-alt mr-1"></i>
                    Редактировать
                </button>

                <button type="submit"
                        class="text-sm text-red-600 hover:text-red-700 font-medium"
                        data-action="open-modal"
                        data-modal="delete_review"
                        th:data-review-id="${review.id}">
                    <i class="fas fa-trash-alt mr-1"></i>
                    Удалить
                </button>

                <!-- EDIT BUTTONS -->
                <button class="save-review-edit-btn edit-mode hidden text-sm text-green-600 font-medium"
                        type="button"
                        data-action="edit-review">
                    Сохранить
                </button>

                <button class="cancel-review-edit-btn edit-mode hidden text-sm text-gray-500 font-medium"
                        data-action="edit-review">
                    Отмена
                </button>

            </div>

        </article>

    </div>

</div>
